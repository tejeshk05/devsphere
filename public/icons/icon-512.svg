<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sphere-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#080c14"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#sphere-glow)"/>
  
  <!-- Outer Sphere Orbit -->
  <ellipse cx="256" cy="256" rx="170" ry="80" fill="none" stroke="url(#ring-grad)" stroke-width="8" transform="rotate(-30 256 256)" stroke-dasharray="12 8"/>
  
  <!-- Core Sphere -->
  <circle cx="256" cy="256" r="85" fill="#0f172a" stroke="#06b6d4" stroke-width="6"/>
  
  <!-- Code Symbol (Brackets) -->
  <path d="M 230 216 L 190 256 L 230 296" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 282 216 L 322 256 L 282 296" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="10" fill="#06b6d4"/>
</svg>

